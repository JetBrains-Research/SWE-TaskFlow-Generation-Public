[project]
name = "interactive-benchmark-generation"
version = "0.1.0"
description = "Generate multi-prompt variants of SWE-style benchmark datasets"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.0.0",
    "huggingface-hub>=1.23.0",
    "litellm>=1.75.5,!=1.82.7,!=1.82.8",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
interactive-benchmark-generation = "interactive_benchmark_generation.cli:main"
swe-taskflow-generation = "interactive_benchmark_generation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
